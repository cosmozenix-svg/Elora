    <script>
      (function() {
        try {
          const isTargetObject = function(obj) {
            return (
              obj === window ||
              (typeof Window !== 'undefined' && obj === Window.prototype) ||
              (typeof globalThis !== 'undefined' && obj === globalThis)
            );
          };

          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (isTargetObject(obj) && prop === 'fetch') {
              let currentFetch = undefined;
              const originalGetter = descriptor && descriptor.get
                ? descriptor.get
                : (descriptor && 'value' in descriptor ? () => descriptor.value : undefined);

              return origDefineProperty.call(Object, obj, prop, {
                get: function() {
                  if (currentFetch !== undefined) return currentFetch;
                  const ctx = (typeof window !== 'undefined' ? window : this);
                  return originalGetter ? originalGetter.call(ctx) : undefined;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: descriptor && descriptor.enumerable !== undefined ? descriptor.enumerable : true
              });
            }
            return origDefineProperty.apply(Object, arguments);
          };

          const origDefineProperties = Object.defineProperties;
          Object.defineProperties = function(obj, props) {
            if (isTargetObject(obj) && props && 'fetch' in props) {
              const { fetch, ...rest } = props;
              Object.defineProperty(obj, 'fetch', fetch);
              return origDefineProperties.call(Object, obj, rest);
            }
            return origDefineProperties.apply(Object, arguments);
          };

          window.addEventListener('error', function(event) {
            if (event && event.message && event.message.includes('Cannot set property fetch')) {
              event.preventDefault();
            }
          });
        } catch (e) {}
      })();
